# /etc/nginx/sites-available/rich-gallery  — ganti kasir.contoh.com dengan domain Anda.
# Setelah aktif, jalankan: sudo certbot --nginx -d kasir.contoh.com  (otomatis menambah HTTPS)
server {
    listen 80;
    server_name kasir.contoh.com;

    client_max_body_size 50m;   # untuk impor cadangan aplikasi lama

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
