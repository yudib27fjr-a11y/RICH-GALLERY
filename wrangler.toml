# Rich Gallery POS di Cloudflare (paket gratis: Workers + Durable Object SQLite).
# Dipasang otomatis oleh GitHub Actions (.github/workflows/cloudflare.yml). Alamat: https://rich-gallery-pos.<subdomain-anda>.workers.dev
name = "rich-gallery-pos"
account_id = "4073e0a1387546626b13e062c9ae4e97"
main = "src/cloudflare/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Alamat utama memakai domain toko (workers.dev sering diblokir provider internet di Indonesia).
# Alamat workers.dev tetap aktif sebagai cadangan.
workers_dev = true
routes = [
  { pattern = "pos.richgallery.my.id", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "TOKO"
class_name = "Toko"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Toko"]

# Kirim antrean ke Google Sheet & bersihkan sesi lama tiap 5 menit.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
